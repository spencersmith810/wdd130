<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background: rgb(120, 96, 64);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 18px;
            font-family: Georgia, "Times New Roman", serif;
        }

        #formContainer {
            width: min(560px, 100%);
            overflow: hidden;
            border: 10px solid rgb(19, 66, 156);
            border-radius: 30px;
            background: white;
        }

        #formHeader {
            height: 170px;
            position: relative;
            display: grid;
            place-items: center;
            padding: 20px;
            background: linear-gradient(rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.18)),
                url("images/jesus_feeds_5000.jpeg") center 20% / cover;
            color: white;
            text-align: center;
            text-shadow: 2px 2px 0 black;
        }

        #formHeader h1 {
            font-size: clamp(2rem, 8vw, 2.55rem);
            line-height: 1;
        }

        #formHeader p {
            margin-top: 8px;
            font-size: clamp(1.3rem, 5vw, 1.65rem);
            font-weight: bold;
        }

        #closeBtn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 1px 7px;
            border: 1px solid #999;
            border-radius: 2px;
            background: #f5f5f5;
            font-size: 1.1rem;
            line-height: 1.15;
        }

        #formContent {
            padding: 20px 20px 18px;
            border: none;
        }

        #formContent h3 {
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.15rem;
        }

        form {
            display: grid;
            grid-template-columns: minmax(210px, 1fr) 1.25fr;
            gap: 16px 18px;
            align-items: center;
        }

        form > label {
            font-size: 1rem;
        }

        form > input {
            width: 100%;
            min-width: 0;
            height: 22px;
            padding: 2px 5px;
        }

        form > select {
            width: 100%;
            min-width: 0;
            height: 25px;
        }

        form section {
            grid-column: 1 / -1;
        }

        .marital-options {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 1rem;
        }

        .marital-options input:nth-of-type(2) {
            margin-left: 4px;
        }

        form section {
            text-align: center;
        }

        form section label {
            margin-left: 3px;
            font-size: 1rem;
        }

        #formContent a,
        #formContent a:visited {
            color: rgb(19, 66, 156);
        }

        form section:last-child {
            margin-top: 2px;
        }

        #bookCovers {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            column-gap: 3px;
            height: 160px;
            background: white;
            overflow: hidden;
            border-radius: 0 0 20px 20px;
        }

        #bookCovers a {
            display: block;
            min-width: 0;
            height: 100%;
            background: #111;
        }

        #bookCovers a:first-child {
            overflow: hidden;
            border-bottom-left-radius: 20px;
        }

        #bookCovers a:last-child {
            overflow: hidden;
            border-bottom-right-radius: 20px;
        }

        #bookCovers img {
            display: block;
            width: 100%;
            height: 100%;
            padding: 1px 1px;
            object-fit: cover;
            object-position: top;
            background-color: #111;
            align-items: center;
        }
    </style>




</head>

<body>
    <div id="formContainer">
        <header id="formHeader">
            <button type="button" id="closeBtn">X</button>
            <div>
                <h1>Daily Feed</h1>
                <p>Scripture a Day</p>
            </div>
        </header>

        <div id="formContent">
            <h3>Sign Up for Daily Scripture Feed</h3>
            <form id="myForm" action="https://formspree.io/f/mzeezbrn" method="POST">
                <input type="hidden" name="_next" value="https://spencersmith810.github.io/wdd130/ice/iceindex.html">
                <label for="favorite-book">Favorite book of scripture:</label>
                <select id="favorite-book" name="favorite_book" required>
                    <option value="" selected disabled>Choose a book</option>
                    <option value="old_testament">Old Testament</option>
                    <option value="new_testament">New Testament</option>
                    <option value="book_of_mormon">Book of Mormon</option>
                    <option value="doctrine_and_covenants">Doctrine and Covenants</option>
                    <option value="pearl_of_great_price">Pearl of Great Price</option>
                </select>

                <label for="study-help">What would help your scripture study most?</label>
                <select id="study-help" name="study_help" required>
                    <option value="" selected disabled>Choose an option</option>
                    <option value="daily_verse">Daily verse</option>
                    <option value="study_question">Study question</option>
                    <option value="reading_plan">Reading plan</option>
                    <option value="scripture_reminder">Scripture reminder</option>
                </select>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="married">Marital status:</label>
                <div class="marital-options">
                    <input type="radio" id="married" name="marital_status" value="married" required>
                    <label for="married">Married</label>
                    <input type="radio" id="single" name="marital_status" value="single" required>
                    <label for="single">Single</label>
                </div>

                <section>
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Subscribe to newsletter</label>
                </section>

                <section>
                    <input type="checkbox" id="conditions" name="conditions" required>
                    <label for="conditions">I acknowledge the <a href="terms.html" target="_blank" rel="noopener">terms and conditions</a></label>
                </section>

                <section>
                    <button type="submit">Submit</button>
                </section>
            </form>
        </div>

        <footer id="bookCovers" aria-label="Scripture books">
            <a href="https://www.churchofjesuschrist.org/study/scriptures/ot?lang=eng" target="_blank">
                <img src="images/old_testament.webp" alt="Old Testament">
            </a>
            <a href="https://www.churchofjesuschrist.org/study/scriptures/nt?lang=eng" target="_blank">
                <img src="images/new_testament.webp" alt="New Testament">
            </a>
            <a href="https://www.churchofjesuschrist.org/study/scriptures/bofm?lang=eng" target="_blank">
                <img src="images/book_of_mormon.webp" alt="Book of Mormon">
            </a>
            <a href="https://www.churchofjesuschrist.org/study/scriptures/dc-testament?lang=eng" target="_blank">
                <img src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
            </a>
            <a href="https://www.churchofjesuschrist.org/study/scriptures/pgp?lang=eng" target="_blank">
                <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">
            </a>

        </footer>
    </div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            window.location.href = "../iceindex.html";
         });
    </script>

</body>

</html>
