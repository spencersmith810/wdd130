<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICE - In Class Examples</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #DBF1FD;
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #12364a;
            background: linear-gradient(to bottom, #f4fcff, #a6d9ee);
        }

        header {
            width: min(1000px, 90%);
            margin: 60px auto;
            padding: 50px 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid white;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(22, 78, 112, 0.15);
            backdrop-filter: blur(8px);
        }

        h1 {
            color: #164e70;
            font-size: 3rem;
            text-shadow: 2px 2px 0 white;
        }

        h2 {
            font-size: 1.2rem;
            font-weight: normal;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 35px 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        nav a {
            display: block;
            padding: 30px 20px;
            color: #164e70;
            background: linear-gradient(135deg, white, #c5eaf7);
            border: 2px solid white;
            border-radius: 12px;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.8), 0 6px 12px rgba(22, 78, 112, 0.2);
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            border-top: 3px solid white;
            border-left: 3px solid white;
        }

        nav a:hover {
            transform: translatey(-5px);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.8), 0 10px 18px rgba(22, 78, 112, 0.3);
        }

        nav a:focus-visible {
            outline: 3px solid #164e70;
            outline-offset: 4px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
            radial-gradient(circle, white 2px, transparent 3px),
            radial-gradient(circle, white 1px, transparent 2px);
            background-size: 100px 100px, 160px 160px;
            animation: snowfall 12s linear infinite;
        }

        header {
            position: relative;
        }

        @keyframes snowfall {
            from {
                background-position: 0 0, 40px 0;
            }

            to {
                background-position: 0 800px, 40px 800px;
            }

        }

        @media (prefers-reduced-motion: reduce) {
            body::before {
                animation: none;
            }

            nav a {
                transition: none;
            }

            nav a:hover {
                transform: none;
            }

        }
    </style>
</head>
<body>
    <header>
        <h1> ICE - In Class Examples</h1>
        <h2>A collection of experiments in HTML, CSS, and creativity.</h2>

                <li><a href="prophet_cards/oaks.html" target="_blank" rel="noopener">Prophet Cards</a></li>
                <li><a href="grid_flags/flags.html">Flags in a Grid</a></li>
                <li><a href="positioning/positioning.html" target="_blank" rel="noopener">Layout Lab</a></li>
                <li><a href="halloween/index.html" target="_blank" rel="noopener">Halloween Page</a></li>
            </ul>
        </nav>
    </header>
</body>
</html>
