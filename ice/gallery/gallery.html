<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images of Christ</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #080b12;
            color: #f4f7fb;
            font-family: Georgia, 'Times New Roman', serif;
            line-height: 1.5;
            margin: 0;
            min-height: 100vh;
            padding: 3rem 1rem;
        }

        #wrapper {
            margin: 0 auto;
            max-width: 660px;
            width: 100%;
        }

        nav {
            background: #151b29;
            border: 1px solid #d8b36a;
            border-radius: 1rem 1rem 0 0;
            padding: 1.5rem;
            text-align: center;
        }

        nav h1 {
            color: #d8b36a;
            font-family: Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: clamp(2rem, 8vw, 3.5rem);
            letter-spacing: 0.08em;
            margin: 0;
            text-transform: uppercase;
        }

        #gallery {
            background-color: #ddd;
            background-image:
                linear-gradient(45deg, #ccc 26%, transparent 26%),
                linear-gradient(135deg, #ccc 26%, transparent 26%),
                linear-gradient(45deg, transparent 75%, #ccc 75%),
                linear-gradient(135deg, transparent 75%, #ccc 75%);
            background-position: 0 0, 10px 0, 10px -10px, 0 10px;
            background-size: 20px 20px;
            border: 12px solid #151b29;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            width: 100%;
        }

        #gallery a {
            background: #151b29;
            cursor: url('images/christus.png'), pointer;
            display: block;
            overflow: hidden;
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        #gallery a:hover {
            box-shadow: 0 0 0 4px #d8b36a;
            position: relative;
            transform: scale(1.03);
            z-index: 1;
        }

        #gallery img {
            aspect-ratio: 2 / 3;
            display: block;
            height: auto;
            object-fit: cover;
            opacity: 0.72;
            transition: opacity 180ms ease;
            width: 100%;
        }

        #gallery a:hover img {
            opacity: 1;
        }

        @media (max-width: 520px) {
            body {
                padding: 1rem 0.5rem;
            }

            #gallery {
                border-width: 8px;
            }

            #gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 340px) {
            #gallery {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #gallery a,
            #gallery img {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <nav>
            <h1>Christ Art Gallery</h1>
        </nav>
        <main>
            <div id="gallery">
                <a href="artwork1.html"><img src="images/small/img1.jpg" alt="Christ and the Nephite People"></a>
                <a href="artwork2.html"><img src="images/small/img2.jpg" alt="Jesus the Christ"></a>
                <a href="artwork3.html"><img src="images/small/img3.jpg" alt="Christ Raising the Daughter of Jairus"></a>
                <a href="artwork4.html"><img src="images/small/img4.jpg" alt="The Lord Appears in the Kirtland Temple"></a>
                <a href="artwork5.html"><img src="images/small/img5.jpg" alt="The Crucifixion of Christ"></a>
                <a href="artwork6.html"><img src="images/small/img6.jpg" alt="Stilling the Storm"></a>
            </div>
        </main>
    </div>
</body>
</html>
